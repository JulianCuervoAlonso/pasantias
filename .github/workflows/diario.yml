name: Buscar pasantías

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 en Argentina/Uruguay
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Instalar navegador (para Bumeran y ZonaJobs)
        continue-on-error: true   # si falla, el resto del buscador sigue andando
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Buscar
        run: python buscar.py
        env:
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      - name: Guardar resultados
        run: |
          git config user.name "bot-pasantias"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Actualización diaria"
          git push
